spring.application.name=sports
server.port=8000

spring.datasource.url=jdbc:h2:mem:sportsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.frontend-url=http://localhost:5174

cric.api.key=${CRIC_API_KEY}
cric.api.base-url=https://api.cricapi.com/v1
cric.api.poll-interval-ms=60000
cric.api.initial-delay-ms=10000