spring.application.name=sports

server.port=${SERVER_PORT:8000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

sportsdata.api.base-url=${SPORTSCORE_API_BASE_URL:https://sportscore.com/api/v1}
sportsdata.api.key=${SPORTSCORE_API_KEY:}
sportsdata.poll-interval-ms=${SPORTSCORE_POLL_INTERVAL_MS:60000}
sportsdata.initial-delay-ms=${SPORTSCORE_INITIAL_DELAY_MS:5000}

app.frontend-url=${FRONTEND_URL:http://localhost:5174}
sportsdata.websocket-topic=${SPORTS_WEBSOCKET_TOPIC:/topic/scores}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never