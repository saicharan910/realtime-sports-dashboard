spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

sportsdata.api.base-url=${SPORTSCORE_API_BASE_URL}
sportsdata.api.key=${SPORTSCORE_API_KEY}
sportsdata.poll-interval-ms=${SPORTSCORE_POLL_INTERVAL_MS:60000}
sportsdata.initial-delay-ms=${SPORTSCORE_INITIAL_DELAY_MS:5000}

app.frontend-url=${FRONTEND_URL}
sportsdata.websocket-topic=${SPORTS_WEBSOCKET_TOPIC:/topic/scores}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never