name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sports-dashboard-ui/package-lock.json
      - name: Install dependencies
        working-directory: sports-dashboard-ui
        run: npm ci
      - name: Lint
        working-directory: sports-dashboard-ui
        run: npm run lint
      - name: Build
        working-directory: sports-dashboard-ui
        run: npm run build
