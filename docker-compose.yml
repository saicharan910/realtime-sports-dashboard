services:
  postgres:
    image: postgres:17-alpine
    container_name: sports-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports_dev_password

    ports:
      - "5432:5432"

    volumes:
      - sports_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sports_postgres_data: