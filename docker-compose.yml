services:
  postgres:
    image: postgres:17-alpine
    container_name: sports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sports_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sports-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sports}
      DATABASE_USERNAME: ${POSTGRES_USER:-sports}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPORTSCORE_API_BASE_URL: ${SPORTSCORE_API_BASE_URL:-https://sportscore.com/api/v1}
      SPORTSCORE_API_KEY: ${SPORTSCORE_API_KEY:?SPORTSCORE_API_KEY is required}
      SPORTSCORE_POLL_INTERVAL_MS: ${SPORTSCORE_POLL_INTERVAL_MS:-60000}
      SPORTSCORE_INITIAL_DELAY_MS: ${SPORTSCORE_INITIAL_DELAY_MS:-5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SPORTS_WEBSOCKET_TOPIC: ${SPORTS_WEBSOCKET_TOPIC:-/topic/scores}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sports-network

  frontend:
    build:
      context: ./sports-dashboard-ui
      dockerfile: Dockerfile
    container_name: sports-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sports-network

volumes:
  sports_postgres_data:

networks:
  sports-network:
    driver: bridge
